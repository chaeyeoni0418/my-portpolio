<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Book</title>
  <link rel="stylesheet" href="visitor.css">
  <script src="../components/header.js" defer></script>
</head>
<body>
  <site-header></site-header>

  <main class="visitor-page">
    <a href="../index/index.html" class="back-home">
      <img src="../img/Caret_Circle_Left.svg" alt="">
      <span>홈으로 돌아가기</span>
    </a>

    <section class="visitor-intro">
      <h2>VISITOR BOOK</h2>
      <p>들러주셔서 고마워요. 짧게 한마디 남겨주면 정말 기쁠 것 같아요.</p>
    </section>

    <section class="guest-form">
      <textarea placeholder="따뜻한 한마디를 남겨주세요 :)"></textarea>
      <button type="button">남기기</button>
    </section>

    <section class="guest-list" aria-label="방명록 목록">
      <article class="guest-card">
        <div>
          <strong>포트폴리오 분위기가 깔끔해서 보기 편했어요!</strong>
          <p>- 친구</p>
        </div>
        <time datetime="2024-05-01">2024.05.01</time>
      </article>

      <article class="guest-card">
        <div>
          <strong>프로젝트 설명이 잘 정리되어 있어서 좋았어요.</strong>
          <p>- 방문자</p>
        </div>
        <time datetime="2024-04-28">2024.04.28</time>
      </article>

      <article class="guest-card">
        <div>
          <strong>앞으로 만드는 작업도 기대할게요. 화이팅!</strong>
          <p>- 이웃</p>
        </div>
        <time datetime="2024-04-25">2024.04.25</time>
      </article>
    </section>
  </main>

  <footer id="contact">
    <h2>Contact</h2>
    <p>Email : chaeyeoni0418@gmail.com</p>
  </footer>
</body>
</html>
