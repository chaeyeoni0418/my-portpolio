<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="clone.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>

    <script>
      $(document).ready(function () {
        $(".slider").bxSlider();
      });
    </script>
  </head>
  <body>
    <div class="top">
      <div>카카오 채널을 추가하고 <span>3천원</span>받기</div>
    </div>

    <div class="menu">
      <div class="left">
        <img src="../img/clone.img/logo.png" alt="" />
      </div>
      <div class="center">
        <ul>
          <li>BEST</li>
          <li>전제품</li>
          <li>리뷰</li>
          <li>이벤트</li>
          <li>브랜드</li>
          <li>제휴문의</li>
          <li>고객센터</li>
        </ul>
      </div>
      <div class="right">
        <div>
          <img src="../img/clone.img/a.svg" alt="" />
          <img src="../img/clone.img/b.svg" alt="" />
          <img src="../img/clone.img/c.svg" alt="" />
        </div>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <div id="hamburger-menu">
          <div></div>
          <div></div>
          <div></div>
        </div>

        <div class="banner">
          <div class="slider">
            <div>
              <img src="../img/clone.img/a.webp" alt="" />
            </div>
            <div>
              <img src="../img/clone.img/b.webp" alt="" />
            </div>
            <div>
              <img src="../img/clone.img/c.webp" alt="" />
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="box1">
          <img src="../img/clone.img/a.jpg" alt="" />
        </div>
        <div class="box2">
          <img src="../img/clone.img/b.jpg" alt="" />
        </div>
      </div>

      <div class="recommend">
        <h1>자신있게 추천해요!</h1> 
      </div>
       
      <div class="list">
        <img src="../img/clone.img/1.jpg" alt="" />
        <img src="../img/clone.img/2.jpg" alt="" />
        <img src="../img/clone.img/3.jpg" alt="" />
        <img src="../img/clone.img/4.jpg" alt="" />
        <img src="../img/clone.img/5.jpg" alt="" />
        <img src="../img/clone.img/6.jpg" alt="" />
      </div>

      <div class="goods">
        <h1>인기상품</h1>
      </div>

      <div class="goodsimg">
        <img src="../img/clone.img/aa.jpg" alt="">
        <img src="../img/clone.img/bb.jpg" alt="">
      </div>
    </div>
  </body>
</html>
